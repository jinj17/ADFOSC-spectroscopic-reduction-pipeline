# input pars

workdir: "path_to_data_directory"

bias_pattern: "bias*fit"

continuum_lamp: "continuum*fit"

arc_lamp:
  pattern: "arclamp*fit"
  name: "HgAr_neon.dat"

standard_star:
  pattern: "Feige66*fit"
  name: "Feige66"
  combine: "mean"

science_obj:
  pattern: "science*fit"
  name: "Science"
  xlim: "1500"
  combine: "mean"

slit: '1.5"'
grism: '676R-420gr/mm'
trim : "True"
spatial_axis: "0"

